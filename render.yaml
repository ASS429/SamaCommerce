# ─────────────────────────────────────────────────────────────
# Blueprint Render — SamaCommerce
#   • samacommerce-api : Laravel 13 (Docker)   → Supabase (PostgreSQL)
#   • samacommerce-ia  : FastAPI (Docker)       → appelé par l'API, facultatif
#   • samacommerce-web : React/Vite (statique)  → appelle l'API
# L'API a un repli heuristique PHP : l'application fonctionne sans le service IA.
#
# Les variables `sync: false` sont les SECRETS, à renseigner dans le tableau de
# bord Render (APP_KEY, DB_URL, ADMIN_PASSWORD…). Voir DEPLOIEMENT.md.
# ─────────────────────────────────────────────────────────────
services:
  # ─── API Laravel (Docker) ───
  - type: web
    name: samacommerce-api
    runtime: docker
    rootDir: apps/api
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt        # région Render la plus proche du Sénégal
    # Adresse française, en service depuis le déploiement précédent (29/09/2026).
    # Règle : on ne change JAMAIS le chemin de santé dans le déploiement qui crée
    # le nouveau — le conteneur encore en service ne le connaîtrait pas.
    healthCheckPath: /api/sante
    envVars:
      - key: APP_NAME
        value: SamaCommerce
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false          # `php artisan key:generate --show` en local → coller ici
      - key: APP_URL
        sync: false          # ex: https://samacommerce-api.onrender.com
      - key: LOG_CHANNEL
        value: stderr        # les journaux remontent dans Render
      - key: PHP_CLI_SERVER_WORKERS
        value: "8"           # plusieurs processus PHP (rafales d'appels du site : statistiques, navigation)
      # ─ Base Supabase (utiliser le CONNECTION POOLER, IPv4 — cf. DEPLOIEMENT.md) ─
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        sync: false          # postgresql://postgres.<ref>:<pwd>@aws-0-<region>.pooler.supabase.com:5432/postgres
      - key: DB_SSLMODE
        value: require
      # ─ Sessions/cache/queue en base. Le cache FICHIER produisait des 500 sous
      #   requêtes concurrentes (race sur storage/framework/cache) ; le store
      #   database s'appuie sur des écritures atomiques Postgres. Le code est de
      #   toute façon tolérant : une panne de cache recalcule au lieu d'échouer ─
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      # ─ Sécurité ─
      # Mot de passe du panneau d'administration. VIDE = compte NEUTRALISÉ
      # (personne ne peut se connecter) : en cas d'oubli, on ferme plutôt que
      # d'ouvrir. 12 caractères minimum.
      - key: ADMIN_PASSWORD
        sync: false
      # Adresse où partent les codes de la vérification en 2 étapes du compte
      # administrateur (son identifiant admin@samacommerce.sn n'est pas une vraie
      # boîte). Saisie dans le tableau de bord, JAMAIS ici : le dépôt est public.
      # Vide = l'administrateur ne peut pas activer la vérification en 2 étapes.
      - key: EMAIL_ADMIN
        sync: false

      # ─ Envoi des e-mails (réinitialisation de mot de passe) via Resend ─
      #
      # API HTTP et NON SMTP : Render bloque les ports SMTP sortants (25/465/587)
      # en protection anti-spam. Constaté en production — l'envoi marchait depuis
      # un poste local et échouait sur Render. L'API passe par le port 443.
      #
      # Sans RESEND_API_KEY, le code de réinitialisation n'est envoyé nulle part
      # et l'utilisateur reste enfermé dehors.
      - key: MAIL_MAILER
        value: resend
      - key: RESEND_API_KEY
        sync: false          # clé Resend (re_...)
      # Tant qu'aucun domaine n'est vérifié chez Resend, SEULE onboarding@resend.dev
      # est autorisée, et Resend ne livre qu'à l'adresse du TITULAIRE du compte.
      - key: MAIL_FROM_ADDRESS
        value: onboarding@resend.dev
      - key: MAIL_FROM_NAME
        value: SamaCommerce

      # Remontée d'erreurs. VIDE = totalement inerte : ni appel réseau, ni
      # surcoût. Renseigner le DSN d'un projet Sentry (offre gratuite) pour
      # recevoir les alertes par e-mail. Couvre les erreurs de l'API ET celles du
      # navigateur, relayées par POST /api/erreurs-navigateur.
      - key: SENTRY_LARAVEL_DSN
        sync: false
      - key: SANCTUM_EXPIRATION
        # 30 jours. Une semaine déconnectait un commerçant qui ferme quelques
        # jours (fêtes, Magal, déplacement) : il retrouvait une session morte.
        # Le jeton reste révocable à tout moment (« Déconnecter tous les appareils »).
        value: "43200"       # 30 jours
      # Adresses publiques : écrites EN CLAIR (rien de secret), pour qu'une
      # resynchronisation du blueprint ne puisse pas les effacer. Le nom
      # français remplace CORS_ALLOWED_ORIGINS / FRONTEND_URL (29/09/2026).
      - key: ORIGINES_CORS_AUTORISEES
        value: https://samacommerce-web.onrender.com
      # Base des liens envoyés aux gens (invitation d'un employé par WhatsApp).
      # Facultatif : à défaut, on retombe sur ORIGINES_CORS_AUTORISEES.
      - key: URL_SITE_WEB
        value: https://samacommerce-web.onrender.com
      # ─ IA : adresse du service samacommerce-ia ci-dessous.
      #   Si le service est retiré, vider la variable suffit : l'API retombe sur
      #   ses heuristiques PHP sans rien casser. ─
      - key: URL_SERVICE_IA
        # Adresse ÉCRITE EN CLAIR, et non `fromService` : Render y a injecté le
        # NOM du service (« samacommerce-ia ») et non son hôte complet, ce qui
        # donnait une résolution DNS immédiatement en échec — et une IA
        # silencieusement désactivée, le repli heuristique masquant la panne.
        value: https://samacommerce-ia.onrender.com

      # ─ Assistant vocal : oreille et voix chez Soynade, cerveau chez Google
      #   (Gemini). Sans les deux clés, le micro ne s'affiche pour personne.
      #   Avec elles, il est réservé aux abonnés dont le plan l'inclut (écran
      #   Plans de l'administration). COMPTES_ASSISTANT_VOCAL l'ouvre EN PLUS à
      #   d'autres identifiants (séparés par des virgules ; « * » = tous). ─
      - key: CLE_API_SOYNADE
        sync: false
      - key: CLE_API_GEMINI
        sync: false          # clé Google AI Studio ; offre gratuite pour l'instant (quota partagé, données utilisées par Google)
      - key: COMPTES_ASSISTANT_VOCAL
        sync: false
      - key: QUOTA_ASSISTANT_VOCAL
        value: "40"          # questions par jour et par commerçant (chacune est facturée)

  # ─── Micro-service IA (Modules A & B) ────────────────────────────────────
  # Prévisions de réapprovisionnement et score de crédit. L'API Laravel l'appelle
  # avec un court délai d'attente et RETOMBE sur ses heuristiques PHP s'il ne
  # répond pas : le service peut donc être absent, lent ou endormi sans jamais
  # casser l'application. Sur le plan gratuit il s'endort après 15 min
  # d'inactivité, et le premier appel suivant repart en heuristique — c'est assumé.
  - type: web
    name: samacommerce-ia
    runtime: docker
    rootDir: services/ia
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /sante
    envVars:
      - key: PORT
        value: "8001"

  # ─── Site React (statique) ───
  # NB : un site statique Render n'a PAS de champ `plan` (toujours gratuit).
  - type: web
    name: samacommerce-web
    runtime: static
    rootDir: apps/web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # Adresse ÉCRITE EN CLAIR, et non `sync: false` : cette variable est lue
      # AU MOMENT DE LA CONSTRUCTION pour composer la CSP (connect-src). C'est
      # arrivé : une resynchronisation du blueprint avait effacé la valeur saisie
      # à la main, le site s'était déployé avec `connect-src 'self'` et chaque
      # écran affichait « Le serveur ne répond pas ». Depuis, une valeur vide
      # fait ÉCHOUER la construction (vite.config.ts).
      - key: VITE_URL_API
        value: https://samacommerce-api.onrender.com/api
    # SPA : toutes les routes retombent sur index.html
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
