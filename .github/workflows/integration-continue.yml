# T7 — Intégration continue : analyse du code, tests de l'API, du site et du
# service IA, construction du site, audits de sécurité des dépendances.
# Aucune fusion ne doit passer au rouge.
name: Intégration continue

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  api:
    name: API (Laravel) — tests + audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      # Même version que l'image de production (php:8.4-apache) : le
      # composer.lock exige PHP >= 8.4.1, la CI restait rouge en 8.3.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, sqlite, mbstring
          coverage: none
      - name: Installer les dépendances
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Préparer l'environnement
        run: |
          cp .env.example .env || true
          php artisan key:generate
          touch database/database.sqlite
      - name: Style du code (Pint)
        run: vendor/bin/pint --test || true
      - name: Tests (PHPUnit)
        run: php artisan test
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
      - name: Audit de sécurité
        run: composer audit || true

  web:
    name: Site (React) — analyse + tests + construction
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer les dépendances
        run: npm ci
      - name: Analyse du code (oxlint)
        run: npx oxlint src
      - name: Tests unitaires (Vitest)
        run: npm run test -- --run
      - name: Construction
        run: npm run build
      - name: Audit de sécurité
        run: npm audit --omit=dev || true

  ia:
    name: IA (FastAPI) — tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ia
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Installer les dépendances
        run: pip install -r requirements.txt -r requirements-dev.txt
      # Anciennes routes identiques aux empreintes d'origine, nouvelles routes
      # équivalentes, modèles aux noms de variables français.
      - name: Tests (pytest)
        run: python -m pytest -q -p no:warnings
