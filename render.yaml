# ─────────────────────────────────────────────────────────────
# Blueprint Render — SamaCommerce
#   • samacommerce-api : Laravel 13 (Docker)  → Supabase (Postgres)
#   • samacommerce-web : React/Vite (statique) → appelle l'API
# Le micro-service IA n'est PAS déployé ici : l'API a un repli heuristique PHP,
# l'app fonctionne sans lui (à ajouter plus tard si besoin).
#
# Les variables `sync: false` sont à renseigner dans le dashboard Render
# (secrets Supabase, APP_KEY, URLs croisées). Voir DEPLOY.md.
# ─────────────────────────────────────────────────────────────
services:
  # ─── API Laravel (Docker) ───
  - type: web
    name: samacommerce-api
    runtime: docker
    rootDir: apps/api
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt        # région Render la plus proche du Sénégal
    healthCheckPath: /api/health
    envVars:
      - key: APP_NAME
        value: SamaCommerce
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false          # `php artisan key:generate --show` en local → coller ici
      - key: APP_URL
        sync: false          # ex: https://samacommerce-api.onrender.com
      - key: LOG_CHANNEL
        value: stderr        # les logs remontent dans Render
      - key: PHP_CLI_SERVER_WORKERS
        value: "8"           # multi-workers pour le serveur PHP (rafales SPA : stats, nav rapide)
      # ─ Base Supabase (utiliser le CONNECTION POOLER, IPv4 — cf. DEPLOY.md) ─
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        sync: false          # postgresql://postgres.<ref>:<pwd>@aws-0-<region>.pooler.supabase.com:5432/postgres
      - key: DB_SSLMODE
        value: require
      # ─ Sessions/cache/queue en base. Le cache FICHIER produisait des 500 sous
      #   requêtes concurrentes (race sur storage/framework/cache) ; le store
      #   database s'appuie sur des écritures atomiques Postgres. Le code est de
      #   toute façon tolérant : une panne de cache recalcule au lieu d'échouer ─
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      # ─ Sécurité ─
      # Remontee d'erreurs. VIDE = totalement inerte : ni appel reseau, ni
      # surcout. Renseigner le DSN d'un projet Sentry (offre gratuite) pour
      # recevoir les alertes par mail. Couvre les erreurs de l'API ET celles du
      # navigateur, relayees par POST /api/client-errors.
      - key: SENTRY_LARAVEL_DSN
        sync: false
      - key: SANCTUM_EXPIRATION
        # 30 jours. Une semaine déconnectait un commerçant qui ferme quelques
        # jours (fêtes, Magal, déplacement) : il retrouvait une session morte.
        # Le jeton reste révocable à tout moment (« Déconnecter tous les appareils »).
        value: "43200"       # 30 jours
      - key: CORS_ALLOWED_ORIGINS
        sync: false          # ex: https://samacommerce-web.onrender.com
      # Base des liens envoyés aux gens (invitation d'un employe par WhatsApp).
      # Facultatif : a defaut, on retombe sur CORS_ALLOWED_ORIGINS.
      - key: FRONTEND_URL
        sync: false          # ex: https://samacommerce-web.onrender.com
      # ─ IA : adresse fournie automatiquement par Render depuis le service ci-dessous.
      #   Render renvoie l'hote SANS schema ; IaClient prefixe https:// de lui-meme.
      #   Si le service est retire, vider la variable suffit : l'API retombe sur
      #   ses heuristiques PHP sans rien casser. ─
      - key: IA_SERVICE_URL
        # Adresse ECRITE EN CLAIR, et non `fromService` : Render y a injecte le
        # NOM du service (« samacommerce-ia ») et non son hote complet, ce qui
        # donnait une resolution DNS immediatement en echec — et une IA
        # silencieusement desactivee, le repli heuristique masquant la panne.
        value: https://samacommerce-ia.onrender.com

  # ─── Web React (site statique) ───
  # NB : un site statique Render n'a PAS de champ `plan` (toujours gratuit).
  # ─── Micro-service IA (Modules A & B) ────────────────────────────────────
  # Previsions de reappro et scoring de credit. L'API Laravel l'appelle avec un
  # court delai d'attente et RETOMBE sur ses heuristiques PHP s'il ne repond
  # pas : le service peut donc etre absent, lent ou endormi sans jamais casser
  # l'application. Sur le plan gratuit il s'endort apres 15 min d'inactivite,
  # et le premier appel suivant repart en heuristique — c'est assume.
  - type: web
    name: samacommerce-ia
    runtime: docker
    rootDir: services/ia
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /docs
    envVars:
      - key: PORT
        value: "8001"

  - type: web
    name: samacommerce-web
    runtime: static
    rootDir: apps/web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false          # ex: https://samacommerce-api.onrender.com/api
    # SPA : toutes les routes retombent sur index.html
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
