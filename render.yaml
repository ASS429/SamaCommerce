# ─────────────────────────────────────────────────────────────
# Blueprint Render — SamaCommerce
#   • samacommerce-api : Laravel 13 (Docker)  → Supabase (Postgres)
#   • samacommerce-web : React/Vite (statique) → appelle l'API
# Le micro-service IA n'est PAS déployé ici : l'API a un repli heuristique PHP,
# l'app fonctionne sans lui (à ajouter plus tard si besoin).
#
# Les variables `sync: false` sont à renseigner dans le dashboard Render
# (secrets Supabase, APP_KEY, URLs croisées). Voir DEPLOY.md.
# ─────────────────────────────────────────────────────────────
services:
  # ─── API Laravel (Docker) ───
  - type: web
    name: samacommerce-api
    runtime: docker
    rootDir: apps/api
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt        # région Render la plus proche du Sénégal
    healthCheckPath: /api/health
    envVars:
      - key: APP_NAME
        value: SamaCommerce
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false          # `php artisan key:generate --show` en local → coller ici
      - key: APP_URL
        sync: false          # ex: https://samacommerce-api.onrender.com
      - key: LOG_CHANNEL
        value: stderr        # les logs remontent dans Render
      - key: PHP_CLI_SERVER_WORKERS
        value: "8"           # multi-workers pour le serveur PHP (rafales SPA : stats, nav rapide)
      # ─ Base Supabase (utiliser le CONNECTION POOLER, IPv4 — cf. DEPLOY.md) ─
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        sync: false          # postgresql://postgres.<ref>:<pwd>@aws-0-<region>.pooler.supabase.com:5432/postgres
      - key: DB_SSLMODE
        value: require
      # ─ Sessions/cache/queue en base. Le cache FICHIER produisait des 500 sous
      #   requêtes concurrentes (race sur storage/framework/cache) ; le store
      #   database s'appuie sur des écritures atomiques Postgres. Le code est de
      #   toute façon tolérant : une panne de cache recalcule au lieu d'échouer ─
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      # ─ Sécurité ─
      - key: SANCTUM_EXPIRATION
        value: "10080"       # 7 jours
      - key: CORS_ALLOWED_ORIGINS
        sync: false          # ex: https://samacommerce-web.onrender.com
      # ─ IA (vide = repli heuristique PHP) ─
      - key: IA_SERVICE_URL
        value: ""

  # ─── Web React (site statique) ───
  # NB : un site statique Render n'a PAS de champ `plan` (toujours gratuit).
  - type: web
    name: samacommerce-web
    runtime: static
    rootDir: apps/web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false          # ex: https://samacommerce-api.onrender.com/api
    # SPA : toutes les routes retombent sur index.html
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
